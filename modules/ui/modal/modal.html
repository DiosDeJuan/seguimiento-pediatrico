<!-- ========================================
     Módulo Modal - Validación Reusable
     ======================================== -->

<div class="modal-overlay" id="modalOverlay"></div>

<div class="modal-container" id="modalContainer">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitulo">Título del Modal</h2>
            <button class="modal-close" id="modalClose">✕</button>
        </div>
        
        <div class="modal-body">
            <p id="modalMensaje">Mensaje del modal</p>
            <ul id="modalLista" class="modal-lista"></ul>
        </div>
        
        <div class="modal-footer">
            <button class="btn-modal-entendido" id="modalBtnEntendido">Entendido</button>
        </div>
    </div>
</div>
